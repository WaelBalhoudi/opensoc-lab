<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="OpenSOC Lab - Network Defense and Threat Detection" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2d4a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect x="0" y="312" width="1280" height="8" fill="url(#accent)"/>

  <!-- Shield icon -->
  <g transform="translate(90,70)">
    <path d="M90 0 L180 32 V100 C180 160 140 200 90 222 C40 200 0 160 0 100 V32 Z"
          fill="#0f1a2e" stroke="url(#accent)" stroke-width="5"/>
    <path d="M55 110 L82 138 L130 80" fill="none" stroke="#22d3ee" stroke-width="12"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title -->
  <text x="320" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="76" font-weight="800" fill="#ffffff">OpenSOC Lab</text>
  <text x="322" y="176" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="28" fill="#94a3b8">Network Defense &amp; Threat Detection</text>
  <text x="322" y="222" font-family="Consolas, 'Courier New', monospace"
        font-size="24" fill="#22d3ee" letter-spacing="2">BUILD. MONITOR. DETECT. INVESTIGATE.</text>

  <!-- Detection chain -->
  <g font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#e2e8f0">
    <g transform="translate(322,250)">
      <rect width="120" height="38" rx="19" fill="#16233d" stroke="#2b4067"/>
      <text x="60" y="25" text-anchor="middle">pfSense</text>
    </g>
    <path d="M448 269 H478" stroke="#3b82f6" stroke-width="3"/>
    <g transform="translate(484,250)">
      <rect width="120" height="38" rx="19" fill="#16233d" stroke="#2b4067"/>
      <text x="60" y="25" text-anchor="middle">Suricata</text>
    </g>
    <path d="M610 269 H640" stroke="#3b82f6" stroke-width="3"/>
    <g transform="translate(646,250)">
      <rect width="120" height="38" rx="19" fill="#16233d" stroke="#2b4067"/>
      <text x="60" y="25" text-anchor="middle">Wazuh</text>
    </g>
  </g>
</svg>
