<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 810" width="1200" height="810" role="img" aria-label="OpenSOC Lab network architecture, Cisco style, top-down layout" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrG" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e9e4f"/>
    </marker>
    <marker id="arrO" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#f58220"/>
    </marker>

    <symbol id="switch" viewBox="0 0 100 100">
      <rect x="8" y="30" width="84" height="42" rx="5" fill="#049fd9" stroke="#036a91" stroke-width="2"/>
      <g stroke="#fff" stroke-width="3" fill="#fff" stroke-linecap="round">
        <line x1="22" y1="45" x2="74" y2="45"/><polygon points="80,45 70,39 70,51" stroke="none"/>
        <line x1="78" y1="58" x2="26" y2="58"/><polygon points="20,58 30,52 30,64" stroke="none"/>
      </g>
    </symbol>
    <symbol id="firewall" viewBox="0 0 100 100">
      <rect x="8" y="14" width="84" height="72" rx="4" fill="#e8590c" stroke="#9c3a05" stroke-width="2"/>
      <g stroke="#fff" stroke-width="2.5" fill="none">
        <line x1="8" y1="38" x2="92" y2="38"/><line x1="8" y1="62" x2="92" y2="62"/>
        <line x1="36" y1="14" x2="36" y2="38"/><line x1="64" y1="14" x2="64" y2="38"/>
        <line x1="22" y1="38" x2="22" y2="62"/><line x1="50" y1="38" x2="50" y2="62"/><line x1="78" y1="38" x2="78" y2="62"/>
        <line x1="36" y1="62" x2="36" y2="86"/><line x1="64" y1="62" x2="64" y2="86"/>
      </g>
    </symbol>
    <symbol id="server" viewBox="0 0 100 100">
      <rect x="24" y="6" width="52" height="88" rx="5" fill="#049fd9" stroke="#036a91" stroke-width="2"/>
      <g stroke="#fff" stroke-width="3" stroke-linecap="round">
        <line x1="34" y1="24" x2="66" y2="24"/><line x1="34" y1="40" x2="66" y2="40"/><line x1="34" y1="56" x2="66" y2="56"/>
      </g>
      <circle cx="40" cy="78" r="4" fill="#9be564"/><circle cx="54" cy="78" r="4" fill="#fff"/>
    </symbol>
    <symbol id="laptop" viewBox="0 0 100 100">
      <rect x="16" y="18" width="68" height="46" rx="4" fill="#0b2a4a" stroke="#049fd9" stroke-width="3"/>
      <polygon points="4,72 96,72 86,84 14,84" fill="#049fd9" stroke="#036a91" stroke-width="2"/>
    </symbol>
  </defs>

  <rect width="1200" height="810" fill="#ffffff"/>

  <!-- Title -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="46" font-size="28" font-weight="700" fill="#0b2a4a">OpenSOC Lab — Network Architecture</text>
    <text x="40" y="72" font-size="15" fill="#64748b">Logical topology · provisional addressing · isolated virtual lab</text>
  </g>

  <!-- Zones -->
  <rect x="70" y="110" width="300" height="250" rx="14" fill="#f1f8fc" stroke="#049fd9" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="88" y="136" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#036a91">TEST ZONE · 192.168.56.0/24</text>

  <rect x="60" y="400" width="1080" height="385" rx="14" fill="#f1f8fc" stroke="#049fd9" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="78" y="426" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#036a91">INTERNAL LAB LAN · 10.10.10.0/24</text>

  <!-- Solid links -->
  <g stroke="#049fd9" stroke-width="3" fill="none">
    <line x1="285" y1="218" x2="550" y2="218"/>
    <line x1="600" y1="268" x2="600" y2="430"/>
    <path d="M600 520 V545"/>
    <path d="M240 545 H960"/>
    <path d="M240 545 V600"/>
    <path d="M600 545 V600"/>
    <path d="M960 545 V600"/>
  </g>

  <!-- SPAN (orange dashed) -->
  <path d="M555 475 H262 V598" stroke="#f58220" stroke-width="3" stroke-dasharray="9 6" fill="none" marker-end="url(#arrO)"/>
  <text x="408" y="464" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#c2610a">SPAN / mirrored traffic</text>

  <!-- Agent logs (green dashed) -->
  <path d="M938 600 V575 H218 V598" stroke="#2e9e4f" stroke-width="3" stroke-dasharray="9 6" fill="none" marker-end="url(#arrG)"/>
  <path d="M578 600 V575" stroke="#2e9e4f" stroke-width="3" stroke-dasharray="9 6" fill="none"/>
  <circle cx="578" cy="575" r="5" fill="#2e9e4f"/>
  <text x="780" y="567" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1f7a3b">Wazuh agent logs</text>

  <!-- Devices -->
  <use href="#laptop" x="195" y="173" width="90" height="90"/>
  <text x="218" y="217" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" fill="#4ade80">&gt;_</text>
  <use href="#firewall" x="550" y="168" width="100" height="100"/>
  <use href="#switch" x="555" y="430" width="90" height="90"/>
  <use href="#server" x="195" y="600" width="90" height="90"/>
  <use href="#server" x="555" y="600" width="90" height="90"/>
  <use href="#laptop" x="915" y="600" width="90" height="90"/>
  <g fill="#049fd9" transform="translate(938,622)">
    <rect width="13" height="9"/><rect x="16" width="13" height="9"/>
    <rect y="12" width="13" height="9"/><rect x="16" y="12" width="13" height="9"/>
  </g>

  <!-- Labels -->
  <g font-family="Arial, Helvetica, sans-serif">
    <g text-anchor="middle">
      <text x="240" y="290" font-size="17" font-weight="700" fill="#0b2a4a">Kali Linux</text>
      <text x="240" y="309" font-size="13" fill="#64748b">192.168.56.10</text>
      <text x="240" y="327" font-size="12" fill="#64748b">authorized test machine</text>

      <text x="240" y="714" font-size="17" font-weight="700" fill="#0b2a4a">Wazuh SIEM + Suricata</text>
      <text x="240" y="734" font-size="13" fill="#64748b">10.10.10.10</text>

      <text x="600" y="714" font-size="17" font-weight="700" fill="#0b2a4a">Linux Server</text>
      <text x="600" y="734" font-size="13" fill="#64748b">10.10.10.20</text>
      <text x="600" y="752" font-size="12" fill="#64748b">SSH · web service</text>

      <text x="960" y="714" font-size="17" font-weight="700" fill="#0b2a4a">Windows Endpoint</text>
      <text x="960" y="734" font-size="13" fill="#64748b">10.10.10.30</text>
    </g>

    <text x="668" y="212" font-size="17" font-weight="700" fill="#0b2a4a">pfSense</text>
    <text x="668" y="232" font-size="12" fill="#64748b">firewall / router</text>

    <text x="662" y="472" font-size="17" font-weight="700" fill="#0b2a4a">LAN Switch</text>
    <text x="662" y="492" font-size="12" fill="#64748b">SPAN / promiscuous mode</text>

    <text x="418" y="208" font-size="13" font-weight="700" fill="#036a91" text-anchor="middle">WAN · 192.168.56.1</text>
    <text x="616" y="356" font-size="13" font-weight="700" fill="#036a91">LAN · 10.10.10.1</text>
  </g>

  <!-- Legend -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#334155">
    <rect x="800" y="110" width="340" height="200" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="818" y="136" font-size="14" font-weight="700" fill="#0b2a4a">Legend</text>
    <line x1="818" y1="158" x2="868" y2="158" stroke="#049fd9" stroke-width="3"/>
    <text x="880" y="163">Network link</text>
    <line x1="818" y1="182" x2="868" y2="182" stroke="#f58220" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="880" y="187">Mirrored (SPAN) traffic</text>
    <line x1="818" y1="206" x2="868" y2="206" stroke="#2e9e4f" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="880" y="211">Wazuh agent log forwarding</text>
    <text x="818" y="242" font-size="12" fill="#64748b">Isolated lab: no route to Internet,</text>
    <text x="818" y="259" font-size="12" fill="#64748b">home, or university networks.</text>
    <text x="818" y="282" font-size="12" fill="#64748b">IPs are provisional. Sensor placement</text>
    <text x="818" y="299" font-size="12" fill="#64748b">is validated during Phase 4.</text>
  </g>
</svg>
